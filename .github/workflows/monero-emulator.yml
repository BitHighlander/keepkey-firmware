name: Monero firmware emulator evidence

on:
  pull_request:
    branches: [alpha]
    paths:
      - 'tools/monero-feasibility/**'
      - 'lib/firmware/fsm.c'
      - 'lib/firmware/messagemap.def'
      - 'lib/firmware/storage.c'
      - 'CMakeLists.txt'
      - 'deps/**'
      - '.github/workflows/monero-emulator.yml'
      - 'scripts/*report*'
  workflow_dispatch:
    inputs:
      full_wallet_evidence:
        description: Build signing firmware and generate private-chain PDF evidence
        type: boolean
        default: true
  workflow_call:
    inputs:
      full_wallet_evidence:
        description: Include full signing, regression and private-chain evidence
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: monero-evidence-${{ github.workflow }}-${{ inputs.full_wallet_evidence || false }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  receive-only:
    name: ${{ inputs.full_wallet_evidence && 'Full signer and private chain' || 'Receive-only controls' }}
    # GitHub's macos-15 label is Apple Silicon. Refuse a future label migration.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Initialize pinned emulator dependencies
        shell: bash
        run: |
          set -euo pipefail
          # The native firmware uses trezor-crypto's C sources, not its vendored
          # MicroPython application. Recursing that unused tree reaches lwIP's
          # dumb-HTTP server, which cannot serve checkout's shallow fetches.
          git submodule update --init \
            code-signing-keys \
            deps/crypto/trezor-firmware \
            deps/device-protocol \
            deps/googletest \
            deps/qrenc/QR-Code-generator \
            deps/sca-hardening/SecAESSTM32
          # The token generator needs the pinned nested ethereum-lists source.
          git submodule update --init --recursive deps/python-keepkey

      - name: Python 3.10 for the pinned legacy nanopb generator
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
          architecture: arm64

      - name: Prepare native build and independent-reference dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew install libsodium boost pkg-config
          cmake --version
          clang --version
          brew list --versions libsodium boost pkg-config
          MONERO_TOOLCHAIN="$RUNNER_TEMP/monero-toolchain"
          mkdir -p "$MONERO_TOOLCHAIN"
          printf 'MONERO_TOOLCHAIN=%s\n' "$MONERO_TOOLCHAIN" >> "$GITHUB_ENV"
          python -m venv "$MONERO_TOOLCHAIN/pyk-venv"
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" -m pip install 'protobuf==3.20.3' 'requests==2.32.5' 'pytest==8.4.2' 'pytest-timeout==2.4.0'
          git init --quiet "$MONERO_TOOLCHAIN/nanopb"
          git -C "$MONERO_TOOLCHAIN/nanopb" remote add origin https://github.com/nanopb/nanopb.git
          git -C "$MONERO_TOOLCHAIN/nanopb" fetch --depth 1 origin 7ee9ef9f627d85cbe1b8c4f49a3ed26eed216c77
          git -C "$MONERO_TOOLCHAIN/nanopb" checkout --detach FETCH_HEAD
          test "$(git -C "$MONERO_TOOLCHAIN/nanopb" rev-parse HEAD)" = 7ee9ef9f627d85cbe1b8c4f49a3ed26eed216c77
          curl --fail --silent --show-error --location \
            https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-osx-aarch_64.zip \
            --output "$MONERO_TOOLCHAIN/protoc.zip"
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" - "$MONERO_TOOLCHAIN/protoc.zip" <<'PY'
          import hashlib, pathlib, sys
          expected = '96839af0caed64352442fc8236f4bdf7c1cd6efcfaa98fa5db37307a73fc7c70'
          if hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest() != expected:
              raise SystemExit('Pinned protoc archive integrity check failed')
          PY
          # The runner expects this directory name; the actual compiler is pinned 21.12.
          unzip -q "$MONERO_TOOLCHAIN/protoc.zip" -d "$MONERO_TOOLCHAIN/protoc351"
          export PATH="$MONERO_TOOLCHAIN/pyk-venv/bin:$MONERO_TOOLCHAIN/protoc351/bin:$PATH"
          cd "$MONERO_TOOLCHAIN/nanopb/generator/proto"
          protoc -I . -I "$MONERO_TOOLCHAIN/protoc351/include" --python_out=. nanopb.proto plugin.proto
          protoc --version

      - name: Build the independent Core arithmetic oracle from hash-pinned files
        shell: bash
        run: |
          set -euo pipefail
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" - <<'PY'
          import hashlib, importlib.util, os, pathlib, urllib.request
          script = pathlib.Path('tools/monero-feasibility/reference.py')
          spec = importlib.util.spec_from_file_location('monero_reference', script)
          reference = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(reference)
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'monero-reference-source'
          for name, expected in reference.CORE_SHA256.items():
              url = f'https://raw.githubusercontent.com/monero-project/monero/{reference.CORE_COMMIT}/{name}'
              with urllib.request.urlopen(url, timeout=30) as response:
                  data = response.read(4 * 1024 * 1024 + 1)
              if len(data) > 4 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit(f'Pinned reference input mismatch: {name}')
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          PY
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" tools/monero-feasibility/reference.py \
            --core-source "$RUNNER_TEMP/monero-reference-source" \
            --boost-include "$(brew --prefix boost)/include" \
            --output "$RUNNER_TEMP/monero-reference"

      - name: Verify evidence capture and input preparation contracts
        shell: bash
        run: |
          set -euo pipefail
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" -m unittest discover \
            -s tools/monero-feasibility/commands -p test_screen_capture.py -v
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" -m unittest discover \
            -s tools/monero-feasibility -p test_prepare_core.py -v
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" -m unittest discover \
            -s tools/monero-feasibility -p test_host_review.py -v

      - name: Build and test receive-only firmware plus ordinary negative controls
        shell: bash
        run: |
          set -euo pipefail
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" tools/monero-feasibility/wallet_emulator.py \
            --receive-only --toolchain-root "$MONERO_TOOLCHAIN" \
            --reference "$RUNNER_TEMP/monero-reference/reference.json" \
            --core-library "$RUNNER_TEMP/monero-reference/core-reference.dylib" \
            --output "$RUNNER_TEMP/monero-receive-validation"

      - name: Package only the research library and public integrity reports
        shell: bash
        run: |
          set -euo pipefail
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'monero-receive-validation'
          report = json.loads((output / 'result.json').read_text())
          assert report['status'] == 'pass' and report['signing_enabled'] is False and report['engine'] is None
          assert all(stage['status'] == 'pass' for stage in report['reports'].values())
          library = pathlib.Path(report['shared_library'])
          assert subprocess.check_output(['lipo', '-archs', str(library)], text=True).strip() == 'arm64'
          lines = subprocess.check_output(['otool', '-L', str(library)], text=True).splitlines()[1:]
          dependencies = [line.strip().split(' (', 1)[0] for line in lines]
          assert set(dependencies) == {'@rpath/libkkemu.dylib', '/usr/lib/libSystem.B.dylib'}, dependencies
          bundle = pathlib.Path(os.environ['RUNNER_TEMP']) / 'monero-emulator-artifact'
          bundle.mkdir()
          filename = 'libkkemu-monero.dylib'
          shutil.copyfile(library, bundle / filename)
          digest = hashlib.sha256(library.read_bytes()).hexdigest()
          assert digest == report['shared_library_sha256']
          source_digest = hashlib.sha256(json.dumps(report['source_sha256'], sort_keys=True).encode()).hexdigest()
          manifest = {
              'schemaVersion': 1, 'label': 'Monero receive-only (research)', 'version': '7.17.0',
              'research': True, 'capabilities': ['address', 'watch-key', 'key-image'], 'signingEnabled': False,
              'source': {'repository': 'https://github.com/BitHighlander/keepkey-firmware',
                         'commit': report['firmware_commit'], 'sourceManifestSha256': source_digest,
                         'validationReportSha256': hashlib.sha256((output / 'result.json').read_bytes()).hexdigest()},
              'files': {'darwin-arm64': {'filename': filename, 'sha256': digest, 'size': library.stat().st_size}},
          }
          public_report = {
              'status': 'pass', 'firmwareCommit': report['firmware_commit'], 'signingEnabled': False,
              'physicalDeviceAccessed': False, 'transactionsBroadcast': False, 'productionReady': False,
              'librarySha256': digest, 'runtimeDependencies': dependencies,
              'stages': {name: {'status': stage['status'], 'checks': len(stage.get('checks', []))}
                         for name, stage in report['reports'].items()},
          }
          public_payload = json.dumps(public_report, indent=2) + '\n'
          manifest['source']['rawValidationReportSha256'] = manifest['source']['validationReportSha256']
          manifest['source']['validationReportSha256'] = hashlib.sha256(public_payload.encode()).hexdigest()
          (bundle / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (bundle / 'validation.json').write_text(public_payload)
          (bundle / 'source-sha256.json').write_text(json.dumps(report['source_sha256'], indent=2) + '\n')
          print(json.dumps(public_report, indent=2))
          PY

      - name: Upload unsigned software research artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: monero-receive-emulator-macos-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/monero-emulator-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Prepare authenticated full signing dependencies
        if: inputs.full_wallet_evidence
        shell: bash
        run: |
          set -euo pipefail
          # Core requires ZeroMQ headers/libraries during configuration even
          # when only its native signing bridge and wallet adapter are built.
          brew install openssl@3 unbound hidapi gnupg zeromq
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" -m pip install -e deps/python-keepkey
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" tools/monero-feasibility/prepare_core.py \
            --archives "$RUNNER_TEMP/monero-core-archives" --source "$RUNNER_TEMP/monero-core-source"
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" tools/monero-feasibility/prepare_host.py \
            --output "$RUNNER_TEMP/monero-host-tools"

      - name: Build full Core signing bridge and host adapter
        if: inputs.full_wallet_evidence
        shell: bash
        run: |
          set -euo pipefail
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" tools/monero-feasibility/build_core.py \
            --source "$RUNNER_TEMP/monero-core-source" --archive-dir "$RUNNER_TEMP/monero-core-archives" \
            --build-dir "$RUNNER_TEMP/monero-core-build" --output "$RUNNER_TEMP/monero-core-engine" \
            --openssl-root "$(brew --prefix openssl@3)" --jobs 2
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" tools/monero-feasibility/build_host.py \
            --source "$RUNNER_TEMP/monero-core-source" --archive-dir "$RUNNER_TEMP/monero-core-archives" \
            --build-dir "$RUNNER_TEMP/monero-core-build" --output "$RUNNER_TEMP/monero-host-adapter" \
            --openssl-root "$(brew --prefix openssl@3)" --jobs 2

      - name: Run full firmware workflow gates and ordinary regression suites
        if: inputs.full_wallet_evidence
        shell: bash
        run: |
          set -euo pipefail
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" tools/monero-feasibility/wallet_emulator.py \
            --toolchain-root "$MONERO_TOOLCHAIN" --engine-link "$RUNNER_TEMP/monero-core-engine/core-link.cmake" \
            --reference "$RUNNER_TEMP/monero-reference/reference.json" \
            --core-library "$RUNNER_TEMP/monero-reference/core-reference.dylib" \
            --output "$RUNNER_TEMP/monero-wallet-validation"
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" tools/monero-feasibility/compatibility_emulator.py \
            --build "$RUNNER_TEMP/monero-wallet-validation/build" \
            --library "$RUNNER_TEMP/monero-wallet-validation/build/lib/libkkemu.dylib" \
            --output "$RUNNER_TEMP/monero-compatibility"
          # Native regression targets can regenerate common build inputs.
          # Freeze after that build and rerun all XMR gates without relinking.
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" tools/monero-feasibility/wallet_emulator.py \
            --toolchain-root "$MONERO_TOOLCHAIN" --engine-link "$RUNNER_TEMP/monero-core-engine/core-link.cmake" \
            --reference "$RUNNER_TEMP/monero-reference/reference.json" \
            --core-library "$RUNNER_TEMP/monero-reference/core-reference.dylib" \
            --existing-build "$RUNNER_TEMP/monero-wallet-validation/build" \
            --ordinary-library "$RUNNER_TEMP/monero-wallet-validation/ordinary-build/lib/libkkemu.dylib" \
            --output "$RUNNER_TEMP/monero-final-validation"

      - name: Sign, decode, mine and verify two private-chain payments
        if: inputs.full_wallet_evidence
        shell: bash
        run: |
          set -euo pipefail
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" tools/monero-feasibility/host_emulator.py \
            --bin-dir "$RUNNER_TEMP/monero-host-tools/bin" \
            --host-adapter "$RUNNER_TEMP/monero-host-adapter/bin/monero-host-adapter" \
            --library "$RUNNER_TEMP/monero-wallet-validation/build/lib/libkkemu.dylib" \
            --core-library "$RUNNER_TEMP/monero-reference/core-reference.dylib" \
            --reference "$RUNNER_TEMP/monero-reference/reference.json" \
            --output "$RUNNER_TEMP/monero-host-validation"

      - name: Validate public evidence and render the firmware PDF
        if: inputs.full_wallet_evidence
        shell: bash
        run: |
          set -euo pipefail
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" tools/monero-feasibility/report_evidence.py \
            --wallet "$RUNNER_TEMP/monero-final-validation" \
            --host "$RUNNER_TEMP/monero-host-validation" \
            --compatibility "$RUNNER_TEMP/monero-compatibility" \
            --output "$RUNNER_TEMP/monero-public-evidence"
          "$MONERO_TOOLCHAIN/pyk-venv/bin/python" scripts/monero-report.py \
            --evidence "$RUNNER_TEMP/monero-public-evidence/manifest.json" \
            --output "$RUNNER_TEMP/monero-public-evidence/monero-firmware-report.pdf"

      - name: Upload only validated public Monero evidence
        if: inputs.full_wallet_evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: monero-wallet-evidence
          path: ${{ runner.temp }}/monero-public-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Retain public compiler diagnostics on failure
        if: failure() && inputs.full_wallet_evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: monero-build-diagnostics
          path: |
            ${{ runner.temp }}/monero-core-engine/*.log
            ${{ runner.temp }}/monero-host-adapter/*.log
          if-no-files-found: warn
          retention-days: 14
