# KeepKey Firmware Release Pipeline
#
# Triggered by version tags (v*).
# Verifies and packages the EXACT binaries from the successful presign CI run
# of the tagged commit (bound to that run's test report and ARM manifests),
# applies the release-only product checks to those bytes, computes hashes,
# and creates a draft GitHub Release with all artifacts.
#
# Tag a commit only after its CI workflow has completed successfully.
#
# Usage:
#   git tag -a v7.15.0-rc17 -m "KeepKey firmware 7.15.0 RC17 test candidate"
#   git push origin v7.15.0-rc17

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  BASE_IMAGE: kktech/firmware@sha256:7438e53933d47d53157ed6d96d864cb208597e62dce26235ace09d1063427fa2

permissions:
  contents: write
  # Reading the CI run's artifacts (test report, ARM products, emulator
  # libraries) needs actions:read for `gh run download`.
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fw_version: ${{ steps.version.outputs.fw_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      ci_run_id: ${{ steps.evidence.outputs.ci_run_id }}
      arm_full_artifact: ${{ steps.evidence.outputs.arm_full_artifact }}
      arm_bitcoin_artifact: ${{ steps.evidence.outputs.arm_bitcoin_artifact }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Extract and verify version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FW_VERSION=$(sed -n '/^project/,/)/p' CMakeLists.txt | grep -oP '\d+\.\d+\.\d+')
          IS_PRERELEASE=false
          RC_PREFIX="${FW_VERSION}-rc"

          if [ "$TAG_VERSION" != "$FW_VERSION" ]; then
            if [[ "$TAG_VERSION" != "${RC_PREFIX}"* ]]; then
              echo "::error::Tag (${TAG_VERSION}) must be ${FW_VERSION} or ${RC_PREFIX}<number>"
              exit 1
            fi

            RC_NUMBER="${TAG_VERSION#"${RC_PREFIX}"}"
            if ! [[ "$RC_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "::error::Invalid release-candidate tag (${TAG_VERSION}); expected ${RC_PREFIX}<number>"
              exit 1
            fi
            IS_PRERELEASE=true
          fi

          {
            echo "fw_version=${FW_VERSION}"
            echo "tag_name=${GITHUB_REF_NAME}"
            echo "is_prerelease=${IS_PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve exact-commit presign evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          FW_VERSION: ${{ steps.version.outputs.fw_version }}
        run: |
          # A tag on a red (or untested) commit must not produce release
          # artifacts. Require a SUCCESSFUL CI run whose head is exactly the
          # tagged commit, and that run's report and both ARM products.
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f status=success -f per_page=100 \
            > /tmp/ci-runs.json
          python3 - <<'PY'
          import json
          import os

          with open('/tmp/ci-runs.json', encoding='utf-8') as handle:
              runs = json.load(handle).get('workflow_runs', [])
          runs = [run for run in runs
                  if run.get('head_sha') == os.environ['GITHUB_SHA']
                  and run.get('conclusion') == 'success']
          if not runs:
              raise SystemExit('no successful CI run exists for the tagged commit')
          run = max(runs, key=lambda item: item.get('created_at', ''))
          run_id = str(run['id'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('ci_run_id=%s\n' % run_id)
          with open('/tmp/ci-run-id', 'w', encoding='ascii') as output:
              output.write(run_id)
          PY
          RUN_ID=$(cat /tmp/ci-run-id)
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            > /tmp/ci-artifacts.json
          python3 - <<'PY'
          import json
          import os

          with open('/tmp/ci-artifacts.json', encoding='utf-8') as handle:
              artifacts = json.load(handle).get('artifacts', [])
          names = [item['name'] for item in artifacts
                   if not item.get('expired')]
          if 'test-report' not in names:
              raise SystemExit('exact-commit CI has no test-report artifact')
          prefix = 'firmware-v%s-' % os.environ['FW_VERSION']
          arm = [name for name in names if name.startswith(prefix)]
          variants = {
              variant: [name for name in arm if name.endswith('-' + variant)]
              for variant in ('full', 'bitcoin-only')
          }
          if any(len(found) != 1 for found in variants.values()):
              raise SystemExit('expected exact full and bitcoin-only ARM artifacts, found %r' % arm)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('arm_full_artifact=%s\n' % variants['full'][0])
              output.write('arm_bitcoin_artifact=%s\n' % variants['bitcoin-only'][0])
          PY

      - name: Verify audited source and binary hashes
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.evidence.outputs.ci_run_id }}
          ARM_FULL_ARTIFACT: ${{ steps.evidence.outputs.arm_full_artifact }}
          ARM_BITCOIN_ARTIFACT: ${{ steps.evidence.outputs.arm_bitcoin_artifact }}
        run: |
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name test-report --dir audited-report
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$ARM_FULL_ARTIFACT" --dir audited-arm/full
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$ARM_BITCOIN_ARTIFACT" --dir audited-arm/bitcoin-only
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def digest(path):
              value = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      value.update(chunk)
              return value.hexdigest()

          report_dir = Path('audited-report')
          arm_dir = Path('audited-arm')
          with (report_dir / 'test-report-manifest.json').open(
                  encoding='utf-8') as handle:
              manifest = json.load(handle)
          if manifest.get('firmware_sha') != os.environ['GITHUB_SHA']:
              raise SystemExit('presign manifest is for a different commit')
          python_sha = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD:deps/python-keepkey'],
              text=True).strip()
          if manifest.get('python_sha') != python_sha:
              raise SystemExit('presign manifest has a different Python pin')
          run_id = os.environ['CI_RUN_ID']
          if not manifest.get('run_url', '').endswith('/' + run_id):
              raise SystemExit('presign manifest names a different CI run')
          pdf = report_dir / manifest['pdf']['path']
          if digest(pdf) != manifest['pdf']['sha256']:
              raise SystemExit('presign PDF hash mismatch')
          variants = manifest.get('arm', {}).get('variants', {})
          if set(variants) != {'full', 'bitcoin-only'}:
              raise SystemExit('presign manifest does not bind both ARM products')
          manifest_hashes = {}
          for variant, evidence in variants.items():
              variant_dir = arm_dir / variant
              arm_manifest = variant_dir / 'arm-build-manifest.json'
              manifest_hashes[variant] = digest(arm_manifest)
              if manifest_hashes[variant] != evidence['manifest_sha256']:
                  raise SystemExit('%s ARM manifest hash mismatch' % variant)
              # CI's manifest also lists the link map, size report and
              # stack-usage archive. Every listed file must be present and
              # byte-identical; the firmware image set (.bin/.elf) must equal
              # the audited one exactly, with nothing extra alongside it.
              for item in evidence['files']:
                  path = variant_dir / item['name']
                  if not path.is_file() or digest(path) != item['sha256']:
                      raise SystemExit('%s audited ARM file mismatch: %s' %
                                       (variant, item['name']))
              expected = {item['name']: item['sha256']
                          for item in evidence['files']
                          if item['name'].endswith(('.bin', '.elf'))}
              actual = {path.name: digest(path)
                        for path in variant_dir.iterdir()
                        if path.suffix in ('.bin', '.elf')}
              if not expected or actual != expected:
                  raise SystemExit('%s audited ARM artifact set or hash mismatch' % variant)
          combined = hashlib.sha256(json.dumps(
              manifest_hashes, sort_keys=True).encode('ascii')).hexdigest()
          if combined != manifest['arm']['manifest_set_sha256']:
              raise SystemExit('ARM manifest-set hash mismatch')
          print('exact presign evidence and both ARM products verified')
          PY

  build-firmware:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # 'suffix' names the published files; 'variant' stays the internal build
          # selector. The default build takes an EMPTY suffix so its assets keep the
          # names every previous release used (v7.14.x shipped firmware.keepkey.bin).
          # Both declared products are independently qualified and bound to
          # their presign manifests. 'arm_output' selects the validated CI ARM
          # artifact for the product.
          - variant: full
            arm_output: arm_full_artifact
            suffix: ""
            cmake_flags: ""
          - variant: bitcoin-only
            arm_output: arm_bitcoin_artifact
            suffix: "-bitcoin-only"
            cmake_flags: "-DKK_BITCOIN_ONLY=ON"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # The release ships the bytes CI built and the audit examined, not a
      # second build. The release-only product gates below run on those bytes.
      - name: Download audited release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.validate.outputs.ci_run_id }}
          ARM_ARTIFACT: ${{ needs.validate.outputs[matrix.arm_output] }}
        run: |
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name test-report --dir audited-report
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$ARM_ARTIFACT" --dir audited-arm

      - name: Prepare the audited binaries
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          report_dir = Path('audited-report')
          arm_dir = Path('audited-arm')
          release = Path('release')
          release.mkdir()
          # Firmware only. Bootloader/updater outputs, if any ever appear in
          # the CI artifact, are not mapped and so cannot be published.
          mappings = {
              '-firmware.keepkey.bin': 'firmware.keepkey.bin',
              '-firmware.keepkey.elf': 'firmware.keepkey.elf',
          }
          copied = set()
          for source in arm_dir.iterdir():
              for suffix, target in mappings.items():
                  if source.name.endswith(suffix):
                      if target in copied:
                          raise SystemExit('duplicate audited artifact: ' + target)
                      shutil.copyfile(str(source), str(release / target))
                      copied.add(target)
          required = {'firmware.keepkey.bin', 'firmware.keepkey.elf'}
          if not required.issubset(copied):
              raise SystemExit('audited firmware bin/elf are missing')
          shutil.copyfile(str(report_dir / 'test-report.pdf'),
                          str(release / 'presign-test-report.pdf'))
          shutil.copyfile(str(report_dir / 'test-report-manifest.json'),
                          str(release / 'presign-evidence-manifest.json'))
          PY

      - name: Check the product boundary (${{ matrix.variant }})
        run: |
          python3 tools/check_bitcoin_only_identity.py \
            --artifact release/firmware.keepkey.bin \
            --elf release/firmware.keepkey.elf \
            --variant '${{ matrix.variant }}'

      # The ALPHA ClearSign root (02de9231...dae7) is embedded in every 7.16
      # alpha build (lib/firmware/clearsign_root.c, no build flag) and is
      # alpha-only: it must never ship in a release. Production gets its own
      # root from a new ceremony after the 7.15 re-release, and those bytes
      # replace the alpha ones before any 7.16 production release; until they
      # do, every 7.16 tag fails here, which is intended. Runs on both
      # variants; bitcoin-only does not link clearsign_root.c at all, so it
      # must not carry the bytes either. The emulator libraries get the same
      # check in create-release.
      - name: Refuse the alpha ClearSign root (${{ matrix.variant }})
        run: |
          python3 - <<'EOF'
          import sys
          ALPHA_ROOT = bytes.fromhex(
              "02de9231b2094433235532fb1932e324a2c7304195e12e610c675cccbbd606dae7")
          if ALPHA_ROOT in open("release/firmware.keepkey.bin", "rb").read():
              sys.exit("::error::alpha ClearSign root in a release artifact: "
                       "production needs its own root (new ceremony after the "
                       "7.15 re-release). Artifact: firmware.keepkey.bin "
                       "(${{ matrix.variant }})")
          print("Alpha ClearSign root absent: firmware.keepkey.bin "
                "(${{ matrix.variant }})")
          EOF

      # Same SRAM budget gate CI enforces (rc8 boot-fault class): release
      # artifacts must clear it too, not just the 16 KiB linker ASSERT.
      - name: SRAM budget gate (${{ matrix.variant }})
        run: |
          pip install --quiet pyelftools
          python3 tools/check_sram_budget.py \
            --elf release/firmware.keepkey.elf \
            --su-tar audited-arm/stack-usage.tgz \
            --budgets tools/sram-budgets.json \
            --variant "${{ matrix.variant }}"

      # A RELEASE PUBLISHES FIRMWARE ONLY -- never a bootloader.
      #
      # The build produces bin/bootloader.bin, and this step used to copy it
      # into release/, where the rename turned it into bootloader.v<ver>.bin and
      # release-assets/* published it. A bootloader is a separately signed
      # artifact with its own rollout, and shipping one as a side effect of
      # tagging firmware is how a device gets bricked by an image nobody
      # reviewed as a bootloader release. It is no longer copied, so it cannot
      # be renamed, hashed or attached.
      #
      # Renaming has to happen BEFORE hashing, or the manifest names files that
      # are never published.
      - name: Rename artifacts
        working-directory: release
        run: |
          VER="${{ needs.validate.outputs.fw_version }}"
          SUFFIX="${{ matrix.suffix }}"
          [ -f firmware.keepkey.bin ] && mv firmware.keepkey.bin "firmware.keepkey.v${VER}${SUFFIX}.bin"
          [ -f firmware.keepkey.elf ] && mv firmware.keepkey.elf "firmware.keepkey.v${VER}${SUFFIX}.elf"
          ls -lh

      # The manifest CI can produce describes the UNSIGNED build, because the
      # signatures do not exist yet: hash-manifest.sh reads that state off the
      # artifacts and says so in the file. Key holders re-run the same script
      # over the signed binaries before publishing -- see the release body's
      # signing checklist -- so the published hashes describe the published
      # bytes rather than a draft nobody installs.
      - name: Compute hashes
        run: |
          scripts/release/hash-manifest.sh release \
            "${{ needs.validate.outputs.fw_version }}" \
            "${{ matrix.variant }}" \
            "${{ matrix.suffix }}"

      - name: Record build provenance
        working-directory: release
        run: |
          VARIANT="${{ matrix.variant }}"
          SUFFIX="${{ matrix.suffix }}"
          {
            echo "firmware_commit=${GITHUB_SHA}"
            echo "source_repository=${GITHUB_REPOSITORY}"
            echo "source_ref=${GITHUB_REF}"
            echo "workflow_ref=${GITHUB_WORKFLOW_REF}"
            echo "builder_image=${BASE_IMAGE}"
            echo "runner_image=${ImageOS:-unknown}"
            echo "variant=${VARIANT}"
            echo "cmake_flags=${{ matrix.cmake_flags }}"
            echo "audited_ci_run_id=${{ needs.validate.outputs.ci_run_id }}"
            echo "audited_arm_artifact=${{ needs.validate.outputs[matrix.arm_output] }}"
          } > "PROVENANCE${SUFFIX}.txt"
          cat "PROVENANCE${SUFFIX}.txt"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-firmware-${{ matrix.variant }}
          path: release/*
          retention-days: 90

  test:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            cmake_flags: ""
          - variant: bitcoin-only
            cmake_flags: "-DKK_BITCOIN_ONLY=ON"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Init required submodules
        run: |
          git submodule update --init deps/crypto/trezor-firmware
          git submodule update --init deps/device-protocol
          git submodule update --init --recursive deps/python-keepkey
          git submodule update --init deps/googletest
          git submodule update --init deps/qrenc/QR-Code-generator
          git submodule update --init deps/sca-hardening/SecAESSTM32

      - name: Cache base image
        id: cache-base
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/base-image.tar
          key: base-image-${{ env.BASE_IMAGE }}

      - name: Pull and cache base image
        if: steps.cache-base.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            docker pull ${{ env.BASE_IMAGE }} && break
            echo "pull attempt $attempt failed"; sleep 15
          done
          docker save ${{ env.BASE_IMAGE }} -o /tmp/base-image.tar

      - name: Load base image from cache
        if: steps.cache-base.outputs.cache-hit == 'true'
        run: docker load -i /tmp/base-image.tar

      - name: Build and test emulator (${{ matrix.variant }})
        run: |
          docker build -t kkemu-release-${{ matrix.variant }} \
            --build-arg coinsupport="${{ matrix.cmake_flags }}" \
            -f scripts/emulator/Dockerfile .
          docker run --rm --entrypoint /bin/sh kkemu-release-${{ matrix.variant }} \
            -c "make xunit; RC=\$?; exit \$RC"

  create-release:
    needs: [validate, build-firmware, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      # Reading the CI run's artifacts (the emulator libraries) needs
      # actions:read. The top-level block grants contents only, and a
      # declared block zeroes every scope it omits.
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-firmware-*
          path: artifacts
          merge-multiple: true

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # No dash in the glob: the default variant's files are HASHES.txt and
          # PROVENANCE.txt, and a 'HASHES-*' pattern would silently drop them.
          cp artifacts/firmware.keepkey*.bin artifacts/firmware.keepkey*.elf \
            artifacts/*.pdf artifacts/*.json \
            artifacts/HASHES*.txt artifacts/PROVENANCE*.txt release-assets/
          ls -lh release-assets/

          # Firmware only. If a bootloader ever reaches this directory again,
          # stop rather than publish it.
          if ls release-assets/ | grep -i bootloader; then
            echo "::error::A bootloader artifact reached the release assets."
            exit 1
          fi

      - name: Attach emulator libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every release ships the emulator native libs alongside the
          # device firmware. They are NOT rebuilt here: CI already built
          # and tested them on the branch push this tag points at, and
          # validate/ already required that run to be green. Reusing that
          # artifact means the published binaries are the ones that were
          # tested, not a lookalike from a second build.
          # The same exact-commit run whose report and ARM products the
          # validate job bound; never a different run of the same commit.
          RUN_ID="${{ needs.validate.outputs.ci_run_id }}"
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful CI run for ${GITHUB_SHA} — cannot source emulator libraries."
            exit 1
          fi
          echo "Sourcing emulator libraries from CI run ${RUN_ID}"
          # Artifacts expire after 30 days. Tagging a commit older than
          # that means re-running CI on it to regenerate them.
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            -n "libkkemu-${GITHUB_SHA}" -D emulator-libs

          # Both platforms or no release. A firmware release that ships a
          # macOS emulator lib and silently omits the Windows one is the
          # exact failure this coupling exists to prevent.
          for asset in libkkemu-macos-arm64.dylib libkkemu-win-x64.dll; do
            test -f "emulator-libs/$asset" || \
              (echo "::error::$asset missing from CI artifact — refusing to publish a partial emulator set." && exit 1)
          done

          # The emulator-libs side of build-firmware's alpha-root refusal.
          # CI compiles the alpha ClearSign root into these libs on every run
          # (no build flag), and the alpha root is alpha-only: a release that
          # carries it fails here. Production gets its own root from a new
          # ceremony after the 7.15 re-release, before any 7.16 production
          # release.
          python3 - <<'EOF'
          import sys
          ALPHA_ROOT = bytes.fromhex(
              "02de9231b2094433235532fb1932e324a2c7304195e12e610c675cccbbd606dae7")
          for name in ("libkkemu-macos-arm64.dylib", "libkkemu-win-x64.dll"):
              if ALPHA_ROOT in open("emulator-libs/" + name, "rb").read():
                  sys.exit("::error::alpha ClearSign root in a release artifact: "
                           "production needs its own root (new ceremony after "
                           "the 7.15 re-release). Artifact: %s" % name)
              print("Alpha ClearSign root absent: %s" % name)
          EOF
          cp emulator-libs/libkkemu-macos-arm64.dylib \
             emulator-libs/libkkemu-win-x64.dll release-assets/
          ls -lh release-assets/

      - name: Generate release body
        run: |
          VER="${{ needs.validate.outputs.fw_version }}"
          cat > release-body.md <<EOF
          ## KeepKey Firmware ${{ needs.validate.outputs.tag_name }}

          ### Variants
          - **regular** — \`firmware.keepkey.v${VER}.bin\` — all supported chains, including Zcash shielded/Orchard
          - **bitcoin-only** — \`firmware.keepkey.v${VER}-bitcoin-only.bin\` — BTC-only, non-BTC coins stripped

          ### Presign evidence
          \`presign-test-report.pdf\` and \`presign-evidence-manifest.json\` are
          the test report and evidence manifest of CI run
          ${{ needs.validate.outputs.ci_run_id }}, bound by hash to the exact
          firmware binaries attached here (both products verified in the
          validate job before anything was packaged).

          ### Emulator
          The same firmware built as a host shared library, for running this
          release in Vault's native emulator without a device:
          - \`libkkemu-macos-arm64.dylib\` — macOS Apple Silicon
          - \`libkkemu-win-x64.dll\` — Windows x86_64

          Both are built from this exact commit by CI and published together.

          ### Reproducible Build Verification
          \`\`\`bash
          ./scripts/build/docker/device/release.sh
          tail -c +257 bin/firmware.keepkey.bin | shasum -a 256
          # bitcoin-only:
          #   ./scripts/build/docker/device/release.sh -DKK_BITCOIN_ONLY=ON
          # (extra args pass through to cmake) and compare against
          # HASHES.txt, or HASHES-bitcoin-only.txt for that variant
          \`\`\`

          > **DRAFT TEST CANDIDATE** — RC artifacts are unsigned and intended for
          > release-candidate testing. Firmware must be signed by 3/5 key holders
          > before publishing a production release.
          >
          > The attached \`HASHES*.txt\` describes the **unsigned** build. Signing
          > rewrites the 256-byte metadata descriptor, so the device-image hash
          > changes; only the payload hash survives it. Do not pin a hash from a
          > draft manifest.

          ### Signing Checklist (per variant)
          - [ ] Built on multiple machines, payload hashes match
          - [ ] Signed on air-gapped machine (3/5 signers)
          - [ ] Storage upgrade tested on production device
          - [ ] **Signatures VERIFIED on every signed variant, BEFORE upload:**
                \`scripts/release/verify-signatures.py <image>\`
                The real 3-of-5 ECDSA check -- the same one the device does --
                parsing the keys from include/keepkey/board/pubkeys.h so a
                rotation cannot leave it checking a stale set.
                The \`--require-signed\` manifest step below is STRUCTURAL ONLY:
                a signature region holding a single non-zero byte passes it, so
                it cannot tell a signed image from an unsigned one. Run both,
                and run this one first.
          - [ ] Signed .bin uploaded, replacing unsigned
          - [ ] \`HASHES*.txt\` regenerated from the signed binaries and re-uploaded:
                \`scripts/release/hash-manifest.sh --require-signed <dir> ${VER} <variant> <suffix>\`
                (fails if any image is missing its quorum; the device-image hash it
                prints is what Vault should pin)
          - [ ] Release notes finalized
          EOF

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: ${{ needs.validate.outputs.is_prerelease }}
          name: "Firmware ${{ needs.validate.outputs.tag_name }}"
          body_path: release-body.md
          files: release-assets/*
          fail_on_unmatched_files: true
