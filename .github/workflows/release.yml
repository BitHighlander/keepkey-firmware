# KeepKey Firmware Release Pipeline
#
# Triggered by version tags (v*) on master.
# Builds both BTC-only and multi-chain firmware,
# computes reproducible hashes, and creates a draft
# GitHub Release with all artifacts.
#
# Git-flow: tag master after merging a release/* or hotfix/* branch.
#
# Usage:
#   git tag v7.14.0
#   git push origin v7.14.0

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  BASE_IMAGE: kktech/firmware:v15

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      fw_version: ${{ steps.version.outputs.fw_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract and verify version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FW_VERSION=$(sed -n '/^project/,/)/p' CMakeLists.txt | grep -oP '\d+\.\d+\.\d+')
          echo "fw_version=${FW_VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$TAG_VERSION" != "$FW_VERSION" ]; then
            echo "::error::Tag (${TAG_VERSION}) != CMakeLists.txt (${FW_VERSION})"
            exit 1
          fi

  build-firmware:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - variant: btc
            coin_support: "-DCOIN_SUPPORT=BTC"
            label: "BTC-only"
          - variant: multichain
            coin_support: ""
            label: "Multi-chain"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache base image
        id: cache-base
        uses: actions/cache@v4
        with:
          path: /tmp/base-image.tar
          key: base-image-${{ env.BASE_IMAGE }}

      - name: Pull and cache base image
        if: steps.cache-base.outputs.cache-hit != 'true'
        run: |
          docker pull ${{ env.BASE_IMAGE }}
          docker save ${{ env.BASE_IMAGE }} -o /tmp/base-image.tar

      - name: Load base image from cache
        if: steps.cache-base.outputs.cache-hit == 'true'
        run: docker load -i /tmp/base-image.tar

      - name: Cross-compile firmware (${{ matrix.label }})
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/root/keepkey-firmware:z \
            ${{ env.BASE_IMAGE }} /bin/sh -c "\
              mkdir /root/build && cd /root/build && \
              cmake -C /root/keepkey-firmware/cmake/caches/device.cmake /root/keepkey-firmware \
                ${{ matrix.coin_support }} \
                -DVARIANTS=NoObsoleteVariants \
                -DCMAKE_BUILD_TYPE=MinSizeRel \
                -DCMAKE_COLOR_MAKEFILE=ON && \
              make && \
              mkdir -p /root/keepkey-firmware/release && \
              cp bin/*.bin /root/keepkey-firmware/release/ && \
              cp bin/*.elf /root/keepkey-firmware/release/ && \
              chmod -R a+rw /root/keepkey-firmware/release"

      - name: Compute hashes
        working-directory: release
        run: |
          VER="${{ needs.validate.outputs.fw_version }}"
          echo "# KeepKey Firmware v${VER} (${{ matrix.label }}) — Hash Manifest" > HASHES.txt
          echo "" >> HASHES.txt
          for f in *.bin; do
            [ -f "$f" ] || continue
            FULL_HASH=$(sha256sum "$f" | awk '{print $1}')
            echo "sha256 (full)    $f  $FULL_HASH" >> HASHES.txt
            FILE_SIZE=$(stat -c%s "$f")
            if [ "$FILE_SIZE" -gt 256 ]; then
              PAYLOAD_HASH=$(tail -c +257 "$f" | sha256sum | awk '{print $1}')
              echo "sha256 (payload) $f  $PAYLOAD_HASH" >> HASHES.txt
            fi
            echo "" >> HASHES.txt
          done
          cat HASHES.txt

      - name: Rename artifacts
        working-directory: release
        run: |
          VER="${{ needs.validate.outputs.fw_version }}"
          VARIANT="${{ matrix.variant }}"
          for f in *.bin; do
            [ -f "$f" ] || continue
            mv "$f" "${VARIANT}-${f%.bin}.v${VER}.bin"
          done
          for f in *.elf; do
            [ -f "$f" ] || continue
            mv "$f" "${VARIANT}-${f%.elf}.v${VER}.elf"
          done
          mv HASHES.txt "HASHES-${VARIANT}.txt"
          ls -lh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware-${{ matrix.variant }}
          path: release/*
          retention-days: 90

  test:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache base image
        id: cache-base
        uses: actions/cache@v4
        with:
          path: /tmp/base-image.tar
          key: base-image-${{ env.BASE_IMAGE }}

      - name: Pull and cache base image
        if: steps.cache-base.outputs.cache-hit != 'true'
        run: |
          docker pull ${{ env.BASE_IMAGE }}
          docker save ${{ env.BASE_IMAGE }} -o /tmp/base-image.tar

      - name: Load base image from cache
        if: steps.cache-base.outputs.cache-hit == 'true'
        run: docker load -i /tmp/base-image.tar

      - name: Build and test emulator (BTC-only)
        run: |
          docker build \
            --build-arg coinsupport="-DCOIN_SUPPORT=BTC" \
            -t kkemu-release -f scripts/emulator/Dockerfile .
          docker run --rm --entrypoint /bin/sh kkemu-release \
            -c "make xunit; RC=\$?; exit \$RC"

  create-release:
    needs: [validate, build-firmware, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download BTC firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-firmware-btc
          path: artifacts/btc

      - name: Download multi-chain firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-firmware-multichain
          path: artifacts/multichain

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp artifacts/btc/* artifacts/multichain/* release-assets/
          ls -lh release-assets/

      - name: Generate release body
        run: |
          VER="${{ needs.validate.outputs.fw_version }}"
          cat > release-body.md <<EOF
          ## KeepKey Firmware v${VER}

          ### Firmware Variants
          - **BTC-only** (\`btc-*\`): Bitcoin-only firmware (~350K)
          - **Multi-chain** (\`multichain-*\`): Full multi-chain support (~700K)

          ### Reproducible Build Verification
          \`\`\`bash
          # BTC-only
          ./scripts/build/docker/device/btcrelease.sh
          tail -c +257 bin/firmware.keepkeybtc.bin | shasum -a 256

          # Multi-chain (no -DCOIN_SUPPORT flag)
          ./scripts/build/docker/device/release.sh
          tail -c +257 bin/firmware.keepkey.bin | shasum -a 256
          \`\`\`

          > **DRAFT** — firmware must be signed by 3/5 key holders before publishing.

          ### Signing Checklist
          - [ ] Built on multiple machines, hashes match
          - [ ] Signed on air-gapped machine (3/5 signers)
          - [ ] Storage upgrade tested on production device
          - [ ] Signed .bin uploaded, replacing unsigned
          - [ ] Release notes finalized
          EOF

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "Firmware v${{ needs.validate.outputs.fw_version }}"
          body_path: release-body.md
          files: release-assets/*
          fail_on_unmatched_files: true
